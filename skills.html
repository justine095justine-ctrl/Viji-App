<!DOCTYPE html>
<html>
<head>
    <title>Viji Skills</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body{font-family:Arial; padding:20px; background:#f4f4f4}
        .container{max-width:400px; margin:auto; background:white; padding:20px; border-radius:10px}
        input, select, button{width:100%; padding:12px; margin:8px 0; border:1px solid #ccc; border-radius:5px}
        button{background:#28a745; color:white; border:none; font-size:16px}
    </style>
</head>
<body>
<div class="container">
    <h2>Karibu Viji Skills</h2>
    <form id="skillForm">
        <input type="text" id="jina" placeholder="Jina Kamili" required>
        <input type="text" id="ujuzi" placeholder="Ujuzi: Mf. Upishi, Umeme" required>
        <input type="tel" id="simu" placeholder="Namba ya Simu" required>
        <button type="submit">Jisajili</button>
    </form>
</div>

<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.0/firebase-database.js"></script>
<script>
  const firebaseConfig = {
  apiKey: "AIzaSyBPtk66nvYMLGbeKZaeuXS1i_uhu-uOUYw",
  authDomain: "viji-app-84c7d.firebaseapp.com",
  projectId: "viji-app-84c7d",
  storageBucket: "viji-app-84c7d.firebasestorage.app",
  messagingSenderId: "906281008310",
  appId: "1:906281008310:web:4616f79f3088cf43b3fa17"
};
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  document.getElementById('skillForm').addEventListener('submit', function(e){
      e.preventDefault();
      const jina = document.getElementById('jina').value;
      const ujuzi = document.getElementById('ujuzi').value;
      const simu = document.getElementById('simu').value;

      db.ref("mafundi").push({
          jina: jina,
          ujuzi: ujuzi,
          simu: simu
      }).then(() => {
          alert("Hongera " + jina + "! Umejisajili kwa mafanikio ✅");
          window.location.href = "asante.html"; // ITAKUPELEKA UKURASA MPYA
          document.getElementById('skillForm').reset();
      }).catch((error) => {
          alert("Kuna tatizo: " + error.message);
      });
  });
</script>
</body>
</html>
