<!DOCTYPE html>
<html lang="sw">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tuma Game Yako - Viji</title>
<style>
body { background:#0F0F0F; color:white; font-family:Arial; padding:20px; }
.header { display:flex; align-items:center; gap:15px; margin-bottom:20px; }
.back-btn { background:#FFD700; color:#000; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold; }
h1 { color:#FFD700; }
.form-box { background:#1A1A1A; padding:20px; border-radius:15px; }
label { display:block; margin:15px 0 5px; font-size:14px; color:#aaa; }
input, textarea { width:100%; padding:12px; background:#222; border:1px solid #333; border-radius:8px; color:white; }
.btn { width:100%; background:#FFD700; color:#000; padding:15px; border:none; border-radius:10px; font-size:16px; font-weight:bold; margin-top:20px; }
.alert { background:#1A1A1A; border-left:4px solid #22C55E; padding:12px; margin-bottom:15px; font-size:13px; }
</style>
</head>
<body>
  <div class="header">
    <a href="viji-games.html" class="back-btn">← Rudi</a>
    <h1>📤 Tuma Game Yako</h1>
  </div>
  
  <div class="alert"><b>🎁 BURE KABISA!</b> Tuma game yako. Kama itapitishwa unapata sifa + 100 Viji Coins za kuanzia</div>

  <div class="form-box">
    <label>Jina lako</label>
    <input type="text" placeholder="Mf: Justine">
    
    <label>Jina la Game yako</label>
    <input type="text" placeholder="Mf: Dodo Run">
    
    <label>Eleza Game yako inafanyaje</label>
    <textarea rows="3" placeholder="Mf: Ni mchezo wa kukimbia na kukusanya dhahabu"></textarea>
    
    <label>Link ya Game yako au File</label>
    <input type="text" placeholder="Weka link ya Github, Google Drive au maelezo">
    
    <label>Namba yako ya WhatsApp</label>
    <input type="text" placeholder="07XXXXXXXX">
    
    <button class="btn" onclick="alert('✅ Asante! Tumepokea game yako. Timu ya Viji itakuwasiliana ndani ya siku 3.')">Tuma Game</button>
  </div>
</body>
</html>
