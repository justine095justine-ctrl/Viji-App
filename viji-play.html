<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheza - Viji Games</title>
<style>
  body { background:#0F0F0F; color:white; font-family:Arial; padding:20px; text-align:center; }
 .header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
 .back-btn { background:#FFD700; color:#000; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold; }
 .timer { background:#EF4444; padding:15px; border-radius:10px; font-size:24px; font-weight:bold; }
 .score { color:#FFD700; font-size:18px; margin:10px 0; }
 .question { background:#1A1A1A; padding:20px; border-radius:15px; margin:20px 0; font-size:16px; min-height:60px; }
 .options button { width:100%; background:#222; color:white; border:1px solid #333; padding:15px; margin:8px 0; border-radius:10px; font-size:15px; cursor:pointer; }
 .options button:active { background:#FFD700; color:#000; }
</style>
</head>
<body>
  <div class="header">
    <a href="viji-games.html" class="back-btn">← Acha</a>
    <div class="timer">⏰ <span id="time">60</span>s</div>
  </div>
  
  <div class="score">🪙 Coins: <span id="coins">0</span></div>
  <div class="question" id="question">Pakia...</div>
  <div class="options" id="options"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const gameType = urlParams.get('type');

let time = 60;
let coins = 0;
let timer;

// BENKI YA MASWALI YA GAME ZOTE 5
const bank = {
  maswali: [
    {q:"Mlima mrefu zaidi Afrika?", a:"Kilimanjaro", opts:["Kilimanjaro","Kenya","Meru","Ruwenzori"]},
    {q:"Rais wa kwanza wa Tanzania?", a:"Nyerere", opts:["Nyerere","Magufuli","Kikwete","Mwinyi"]},
    {q:"Mji mkuu wa Tanzania?", a:"Dodoma", opts:["Dar","Dodoma","Arusha","Mwanza"]},
    {q:"Ziwa kubwa zaidi Afrika?", a:"Victoria", opts:["Tanganyika","Victoria","Nyasa","Malawi"]},
    {q:"Pesa ya Tanzania?", a:"Shilingi", opts:["Shilingi","Dollar","Rand","Euro"]}
  ],
  hesabu: [
    {q:"37 x 3 =?", a:"111", opts:["111","101","120","90"]},
    {q:"144 / 12 =?", a:"12", opts:["10","12","14","16"]},
    {q:"25 + 48 =?", a:"73", opts:["73","68","75","70"]},
    {q:"9 x 9 =?", a:"81", opts:["72","81","90","99"]},
    {q:"100 - 37 =?", a:"63", opts:["63","67","53","73"]}
  ],
  kumbuka: [
    {q:"Ni kipi si chakula cha TZ?", a:"Sushi", opts:["Ugali","Sushi","Wali","Nyama"]},
    {q:"Mji wa almasi upo wapi?", a:"Shinyanga", opts:["Arusha","Shinyanga","Mwanza","Geita"]},
    {q:"Chakula maarufu Zanzibar?", a:"Pilau", opts:["Ugali","Pilau","Chipsi","Wali"]},
    {q:"Mnyama wa Taifa?", a:"Simba", opts:["Ndovu","Simba","Twiga","Chui"]},
    {q:"Ndege wa Taifa?", a:"Tai", opts:["Tai","Korongo","Kanga","Njiwa"]}
  ],
  ramani: [
    {q:"Mwanza inajulikana na nini?", a:"Samaki", opts:["Kahawa","Samaki","Chai","Pamba"]},
    {q:"Arusha inajulikana na nini?", a:"Utalii", opts:["Utalii","Madini","Kilimo","Biashara"]},
    {q:"Mbeya inajulikana na nini?", a:"Chai", opts:["Chai","Kahawa","Almasi","Dhahabu"]},
    {q:"Kilimanjaro inajulikana na nini?", a:"Kahawa", opts:["Kahawa","Chai","Pamba","Mchele"]},
    {q:"Geita inajulikana na nini?", a:"Dhahabu", opts:["Dhahabu","Almasi","Maka","Chuma"]}
  ],
  fumbo: [
    {q:"Fimbo ya...", a:"Mnyonge", opts:["Mnyonge","Mlafi","Mlevi","Mvivu"]},
    {q:"Asiyefunzwa na mamake...", a:"Atafunzwa na ulimwengu", opts:["Atafunzwa na ulimwengu","Atakufa","Atapona","Ataolewa"]},
    {q:"Kidole kimoja...", a:"hakivunji chawa", opts:["hakivunji chawa","hakitoshi","hakiendi mbali","hakina nguvu"]},
    {q:"Mchezea watoto...", a:"hafi", opts:["hafi","halala","hasomi","hafanyi kazi"]},
    {q:"Asiye na ndugu...", a:"hufa magonjwa", opts:["hufa magonjwa","hufa njaa","hufa mapema","hufa maskini"]}
  ]
};

let maswali = bank[gameType]? bank[gameType].sort(() => 0.5 - Math.random()) : bank.maswali;
let current = 0;

function startTimer(){
  timer = setInterval(()=>{
    time--; document.getElementById("time").innerText = time;
    if(time <= 0){ malizaGame(); }
  },1000);
}

function loadQ(){
  if(current >= maswali.length){ current = 0; maswali.sort(() => 0.5 - Math.random()); }
  let q = maswali[current];
  document.getElementById("question").innerText = q.q;
  let opts = q.opts.sort(() => 0.5 - Math.random());
  document.getElementById("options").innerHTML = opts.map(o=>
    `<button onclick="check('${o}')">${o}</button>`
  ).join("");
}

function check(ans){
  if(ans === maswali[current].a){
    coins += 3; // TOA COIN 3
    document.getElementById("coins").innerText = coins;
  }
  current++; loadQ();
}

function malizaGame(){
  clearInterval(timer);
  alert(`⏰ Muda umemaliza!\nUmekusanya 🪙 ${coins} Viji Coins`);
  
  // Hifadhi coin
  let total = parseInt(localStorage.getItem("vijiCoins")) || 0;
  total += coins;
  localStorage.setItem("vijiCoins", total);
  
  // Angalia Hall of Fame
  let hallCoins = parseInt(localStorage.getItem("hallCoins")) || 0;
  if(total > hallCoins){
    let jina = prompt("🎉 Hongera! Umekuwa No.1\nWeka jina lako la Hall of Fame:");
    if(jina){
      localStorage.setItem("hallName", jina);
      localStorage.setItem("hallCoins", total);
    }
  }
  window.location.href = "viji-games.html";
}

loadQ(); startTimer();
</script>
</body>
</html>
