<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cheza - Viji Games</title>
<style>
  body { background:#0F0F0F; color:white; font-family:Arial; padding:20px; text-align:center; }
.header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
.back-btn { background:#FFD700; color:#000; padding:10px 15px; border-radius:8px; text-decoration:none; font-weight:bold; }
.timer { background:#EF4444; padding:15px; border-radius:10px; font-size:24px; font-weight:bold; }
.score { color:#FFD700; font-size:18px; margin:10px 0; }
.question { background:#1A1A1A; padding:20px; border-radius:15px; margin:20px 0; font-size:16px; min-height:60px; }
.input-box { width:100%; padding:15px; background:#222; border:2px solid #FFD700; border-radius:10px; color:white; font-size:16px; text-align:center; margin:10px 0; }
.submit-btn { width:100%; background:#FFD700; color:#000; padding:15px; border:none; border-radius:10px; font-size:16px; font-weight:bold; }
.feedback { margin-top:10px; font-size:14px; font-weight:bold; }
</style>
</head>
<body>
  <div class="header">
    <a href="viji-games.html" class="back-btn">← Acha</a>
    <div class="timer">⏰ <span id="time">60</span>s</div>
  </div>
  
  <div class="score">🪙 Coins: <span id="coins">0</span></div>
  <div class="question" id="question">Pakia...</div>
  <input type="text" id="answerInput" class="input-box" placeholder="Andika jibu hapa...">
  <button class="submit-btn" onclick="checkAnswer()">THIBITISHA</button>
  <div id="feedback" class="feedback"></div>

<script>
const urlParams = new URLSearchParams(window.location.search);
const gameType = urlParams.get('type');

let time = 60;
let coins = 0;
let timer;
let currentQ;

// BENKI KUBWA - MASWALI YA DUNIA NZIMA KILA GAME
const bank = {
  maswali: [ // HISTORIA + JIOPOLITIKA DUNIA
    {q:"Ni nchi ngapi zipo duniani zilizotambuliwa na Umoja wa Mataifa?", a:"193"},
    {q:"Mto mrefu zaidi duniani unaitwaje?", a:"Nile"},
    {q:"Nchi iliyo na idadi kubwa ya watu duniani 2026?", a:"India"},
    {q:"Nani alikuwa Rais wa kwanza wa Marekani?", a:"Washington"},
    {q:"Vita vya pili vya dunia vilimalizika mwaka gani?", a:"1945"},
    {q:"Sarafu inayotumika nchi nyingi za Ulaya?", a:"Euro"},
    {q:"Mlima mrefu zaidi duniani?", a:"Everest"},
    {q:"Mji mkuu wa Japan?", a:"Tokyo"},
    {q:"Nchi iliyo na silaha za nyuklia nyingi zaidi?", a:"Russia"},
    {q:"Tuzo kubwa ya Amani duniani?", a:"Nobel"}
  ],
  hesabu: [ // HESABU ZA DUNIA - ZOTE NIVEAU
    {q:"2^10 =?", a:"1024"},
    {q:"Suluhisha: 5x - 10 = 15. x =?", a:"5"},
    {q:"Eneo la mstatili 12m x 8m =?", a:"96"},
    {q:"√256 =?", a:"16"},
    {q:"Log10 ya 10000 =?", a:"4"},
    {q:"25% ya 480 =?", a:"120"},
    {q:"Kasi = Umbali/Muda. Kama 300km kwa masaa 5, kasi?", a:"60"},
    {q:"Pi hadi nambari 2?", a:"3.14"},
    {q:"Faktor za 72?", a:"1,2,3,4,6,8,9,12,18,24,36,72"},
    {q:"Mteremko wa (1,2) na (3,10)?", a:"4"}
  ],
  kumbuka: [ // SAYANSI YA DUNIA
    {q:"Gesi kubwa zaidi katika anga?", a:"Nitrojeni"},
    {q:"Chembe yenye chaji hasi?", a:"Elektroni"},
    {q:"Kipimo cha nguvu?", a:"Newton"},
    {q:"Mtoaji wa damu mwilini?", a:"Moyo"},
    {q:"Mchakato wa mimea kutengeneza chakula?", a:"Utoaji wa lishe"},
    {q:"Chuma kinachopatikana damu?", a:"Chuma"},
    {q:"Kipimo cha umbali kati ya nyota?", a:"Mwaka wa mwanga"},
    {q:"Joto la kuyeyuka kwa barafu?", a:"0"},
    {q:"Nishati ya jua inatoka wapi?", a:"Muungano wa nyuklia"},
    {q:"DNA inasimama nini?", a:"Deoxyribonucleic Acid"}
  ],
  ramani: [ // JIOPOLITIKA + JIOLAJIA DUNIA
    {q:"Mji mkuu wa Canada?", a:"Ottawa"},
    {q:"Jangwa kubwa zaidi duniani?", a:"Sahara"},
    {q:"Kisiwa kikubwa zaidi duniani?", a:"Greenland"},
    {q:"Mto Amazon upo bara gani?", a:"Amerika ya Kusini"},
    {q:"Nchi iliyo na nguzo za Eiffel?", a:"Ufaransa"},
    {q:"Mji mkuu wa Australia?", a:"Canberra"},
    {q:"Bahari kubwa zaidi?", a:"Pasifiki"},
    {q:"Nchi ya Pyramidi?", a:"Misri"},
    {q:"Bara dogo zaidi?", a:"Australia"},
    {q:"Jangwa la Gobi lipo nchi gani?", a:"China"}
  ],
  fumbo: [ // METHALI + FASIHI ZA DUNIA
    {q:"Mwandishi wa 'Romeo na Juliet'?", a:"Shakespeare"},
    {q:"Methali ya Kiingereza: 'A stitch in time saves...?'", a:"nine"},
    {q:"Mtunzi wa 'The Old Man and the Sea'?", a:"Hemingway"},
    {q:"Fumbo: Niko kila mahali lakini hunioni?", a:"Hewa"},
    {q:"Nahau: Kupiga mbizi?", a:"kufa"},
    {q:"Mshairi maarufu wa Nigeria?", a:"Soyinka"},
    {q:"Methali: 'Mti hauendi kwa kisu' maana?", a:"uvivu"},
    {q:"Kitabu kitakatifu cha Waislamu?", a:"Qurani"},
    {q:"Kitabu cha kwanza cha Biblia?", a:"Mwanzo"},
    {q:"Nahau ya Kichina: 'Paka mweusi chumba cheusi'?", a:"tatizo"}
  ]
};

let maswali = bank[gameType]? bank[gameType].sort(() => 0.5 - Math.random()) : bank.maswali;
let current = 0;

function startTimer(){
  timer = setInterval(()=>{
    time--; document.getElementById("time").innerText = time;
    if(time <= 0){ malizaGame(); }
  },1000);
}

function loadQ(){
  if(current >= maswali.length){ current = 0; maswali.sort(() => 0.5 - Math.random()); }
  currentQ = maswali[current];
  document.getElementById("question").innerText = `${current+1}. ${currentQ.q}`;
  document.getElementById("answerInput").value = "";
  document.getElementById("feedback").innerText = "";
}

function checkAnswer(){
  let userAns = document.getElementById("answerInput").value.trim().toLowerCase();
  let correctAns = currentQ.a.toLowerCase();
  
  if(userAns === correctAns){
    coins += 5;
    document.getElementById("coins").innerText = coins;
    document.getElementById("feedback").innerText = "✅ SAHIHI! +5 Coins";
    document.getElementById("feedback").style.color = "#22C55E";
  } else {
    document.getElementById("feedback").innerText = `❌ MAKOSA! Jibu: ${currentQ.a}`;
    document.getElementById("feedback").style.color = "#EF4444";
  }
  
  setTimeout(()=>{ current++; loadQ(); }, 1500);
}

document.getElementById("answerInput").addEventListener("keypress", function(e){
  if(e.key === "Enter"){ checkAnswer(); }
});

function malizaGame(){
  clearInterval(timer);
  alert(`⏰ Muda umemaliza!\nUmekusanya 🪙 ${coins} Viji Coins`);
  
  let total = parseInt(localStorage.getItem("vijiCoins")) || 0;
  total += coins;
  localStorage.setItem("vijiCoins", total);
  
  let hallCoins = parseInt(localStorage.getItem("hallCoins")) || 0;
  if(total > hallCoins){
    let jina = prompt("🎉 Hongera! Umekuwa No.1\nWeka jina lako la Hall of Fame:");
    if(jina){
      localStorage.setItem("hallName", jina);
      localStorage.setItem("hallCoins", total);
    }
  }
  window.location.href = "viji-games.html";
}

loadQ(); startTimer();
</script>
</body>
</html>
