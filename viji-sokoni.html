<!DOCTYPE html>

<head>

<title>Viji Sokoni</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#0F0F0F; color:white; font-family:Arial, sans-serif; }
  .header { background:#0F0F0F; padding:15px; border-bottom:2px solid #F97316; position:sticky; top:0; display:flex; align-items:center; gap:15px; }
  .back-btn { background:#F97316; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold; cursor:pointer; text-decoration:none; }
  .header-center { flex:1; text-align:center; }
  .header-center h1 { color:#F97316; margin:0; font-size:20px; }
  .search-box { padding:15px; }
  .search-box input { width:100%; padding:12px; background:#1A1A1A; border:1px solid #333; border-radius:10px; color:white; }
  .tabs { display:flex; padding:0 15px 15px 15px; gap:10px; }
  .tab { padding:10px 18px; background:#1A1A1A; border-radius:20px; cursor:pointer; font-size:14px; font-weight:bold; }
  .tab.active { background:#F97316; }
  .app-container { padding:15px; max-width:700px; margin:auto; }
  .card { background:#1A1A1A; border-radius:12px; margin-bottom:15px; padding:15px; }
  .card img { width:100%; height:180px; object-fit:cover; border-radius:8px; margin-bottom:10px; }
  .badge { padding:6px 12px; border-radius:6px; font-size:11px; font-weight:bold; background:#F97316; margin-bottom:10px; display:inline-block; }
  .bei { color:#22C55E; font-weight:bold; font-size:18px; margin:10px 0; }
  .btn { background:#22C55E; color:white; padding:14px; border:none; border-radius:10px; width:100%; font-weight:bold; font-size:15px; cursor:pointer; }
  .fab { position:fixed; bottom:25px; right:20px; background:#F97316; color:white; width:56px; height:56px; border-radius:50%; font-size:32px; border:none; }
</style>
</head>
<body>
  <div class="header">
