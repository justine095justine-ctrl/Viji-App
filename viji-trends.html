<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viji Trends - Video Fupi</title>
<style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial}
    body{background:#0D0F1A; color:white}
   .header{background:linear-gradient(135deg, #F97316, #0D0F1A); padding:15px; text-align:center}
   .header h1{font-size:20px}
   .container{padding:10px}
   .add-trend-btn{width:100%; padding:14px; background:#F97316; border:none; border-radius:10px; color:white; font-weight:bold; font-size:16px; margin-bottom:15px}
   .trend-card{background:#1A1E2E; border-radius:12px; margin-bottom:15px; padding:10px}
   .trend-card video{width:100%; border-radius:10px; background:#000}
   .trend-info{display:flex; justify-content:space-between; margin-top:8px; font-size:12px}
   .like-btn{background:#F97316; border:none; color:white; padding:8px 15px; border-radius:8px}
   .modal{display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.9); z-index:100; padding:20px}
   .modal-content{background:#1A1E2E; padding:20px; border-radius:12px}
   .modal input{width:100%; padding:10px; margin:8px 0; background:#0D0F1A; border:1px solid #333; color:white; border-radius:8px}
</style>
</head>
<body>

<div class="header">
    <h1>🔥 VIJI TRENDS</h1>
    <p>Video Fupi + Viral + Methali</p>
</div>

<div class="container">
    <button class="add-trend-btn" onclick="openModal()">+ Weka Video Yako</button>
    <div id="trendsList"></div>
</div>

<!-- Modal ya Kuadd Video -->
<div class="modal" id="trendModal">
    <div class="modal-content">
        <h3>Weka Video Mpya</h3>
        <input id="trendTitle" placeholder="Maelezo ya Video">
        <label>Chagua Video:</label>
        <input id="trendVideo" type="file" accept="video/*">
        <button style="background:#F97316; color:white; width:48%" onclick="addTrend()">Post</button>
        <button style="background:#6B7280; color:white; width:48%" onclick="closeModal()">Funga</button>
    </div>
</div>

<script>
let trends = JSON.parse(localStorage.getItem('vijiTrends')) || [];

async function toBase64(file){
    return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = () => resolve(reader.result);
        reader.onerror = error => reject(error);
    });
}

async function addTrend(){
    const videoFile = document.getElementById('trendVideo').files[0];
    if(!videoFile){ alert("Chagua video"); return; }

    const newTrend = {
        title: document.getElementById('trendTitle').value,
        video: await toBase64(videoFile),
        likes: 0,
        time: Date.now()
    };
    trends.unshift(newTrend);
    localStorage.setItem('vijiTrends', JSON.stringify(trends));
    closeModal();
    displayTrends();
}

function displayTrends(){
    const list = document.getElementById('trendsList');
    list.innerHTML = '';
    trends.forEach((t, i) => {
        list.innerHTML += `
        <div class="trend-card">
            <video src="${t.video}" controls></video>
            <p>${t.title}</p>
            <div class="trend-info">
                <button class="like-btn" onclick="like(${i})">❤️ ${t.likes}</button>
                <span>Video ${i+1}</span>
            </div>
        </div>`;
    });
}

function like(i){ trends[i].likes++; localStorage.setItem('vijiTrends', JSON.stringify(trends)); displayTrends(); }
function openModal(){document.getElementById('trendModal').style.display='block'}
function closeModal(){document.getElementById('trendModal').style.display='none'}

displayTrends();
</script>
</body>
</html>
