<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ongeza Kozi / Makala - Viji</title>
  <style>
    body { background:#0F0F0F; color:white; font-family:Arial, sans-serif; margin:0; padding:0; }
  .header { background:#1A1A1A; padding:15px; text-align:center; border-bottom:2px solid #F97316; }
  .header h1 { color:#F97316; margin:0; font-size:20px; }
  .container { padding:15px; max-width:600px; margin:auto; }
  .card { background:#1A1A1A; border-radius:12px; padding:20px; border:1px solid #222; }
    label { display:block; margin-bottom:8px; font-weight:bold; font-size:14px; }
    input, textarea, select { width:100%; padding:12px; background:#222; border:1px solid #333; border-radius:8px; color:white; margin-bottom:15px; font-size:14px; box-sizing:border-box; }
    textarea { min-height:80px; }
  .btn { background:#F97316; color:white; padding:14px; border:none; border-radius:8px; width:100%; font-weight:bold; font-size:16px; cursor:pointer; }
  .btn:hover { background:#EA580C; }
  .note { background:#222; padding:12px; border-radius:8px; font-size:12px; color:#aaa; margin-bottom:15px; border-left:3px solid #F97316; }
  .note.error { border-left:3px solid red; }
  .preview-img { width:100%; height:180px; background:#222; border-radius:10px; object-fit:cover; margin-bottom:10px; display:none; }
  .upload-options { display:flex; gap:10px; }
  .hidden { display:none; }
  </style>
</head>
<body>

  <div class="header">
    <h1>✍️ Ongeza Kozi / Makala / Kitabu</h1>
    <p>Andika na Pata Pesa</p>
  </div>

  <div class="container">
    <div class="card">
      <form id="fomuOngeza">

        <label>1. Chagua Aina ya Maudhui *</label>
        <select id="aina" onchange="onyeshaSehemu()">
          <option value="story">Story / Hadithi</option>
          <option value="makala">Makala ya Elimu</option>
          <option value="noti">Noti za Shule</option>
          <option value="kitabu">Kitabu PDF</option>
          <option value="kozi">Kozi Kamili</option>
        </select>

        <label>2. Picha ya Kifuniko / Cover</label>
        <img id="preview" class="preview-img">
        <div class="upload-options">
          <input type="file" id="pichaGallery" accept="image/*" style="flex:1;">
          <input type="text" id="linkPicha" placeholder="Au weka Link ya Picha" style="flex:2;">
        </div>

        <label>3. Kichwa cha Habari / Kozi *</label>
        <input type="text" id="kichwa" placeholder="Mfano: Jinsi ya Kuza Biashara" required>

        <!-- SEHEMU YA KOZI TU -->
        <div id="sehemuKozi" class="hidden">
          <div class="note error">
            ⚠️ Kumbuka: Video ya Kozi lazima isiwe zaidi ya Dakika 5
          </div>

          <label>4. Pakia Video ya Somo</label>
          <input type="file" id="videoKozi" accept="video/*">
          <input type="text" id="linkVideo" placeholder="Au weka Link ya YouTube">
          <p style="font-size:12px; color:#aaa;">Video fupi. Dakika 3-5 inatosha kueleza kitu 1</p>

          <label>5. Pakia Noti / PDF ya Somo</label>
          <input type="file" id="pdfKozi" accept=".pdf">

          <label>6. Maswali 3 ya Mtihani</label>
          <textarea id="maswali" placeholder="1. Swali la 1?&#10;2. Swali la 2?&#10;3. Swali la 3?"></textarea>
        </div>

        <!-- SEHEMU YA STORY/MAKALA -->
        <div id="sehemuMaudhui">
          <label>4. Kionjo cha Maneno 20 *</label>
          <div class="note">Andika maneno 20 ya kwanza tu. Haya ndio watu watasoma Bure</div>
          <textarea id="kionjo" placeholder="Mfano: Alikuwa na ndoto kubwa sana..." maxlength="200" required></textarea>

          <label>5. Maudhui Kamili *</label>
          <textarea id="maudhui" placeholder="Andika maudhui yako kamili hapa..." rows="8" required></textarea>
        </div>

        <label>7. Weka Bei</label>
        <div class="note">Kozi: Tsh 5,000. Story: Tsh 500. Kitabu: Tsh 2,000</div>
        <input type="number" id="bei" placeholder="Bei Tsh" value="500">

        <label>8. Jina Lako la Mwalimu / Mwandishi</label>
        <input type="text" id="mwandishi" placeholder="Mfano: Mwalimu Juma">

        <button type="submit" class="btn">Tuma kwa Ukaguzi</button>
      </form>
    </div>
  </div>

<script>
  // KUONYESHA/FICHA SEHEMU KWA SABABU YA AINA
  function onyeshaSehemu(){
    let aina = document.getElementById('aina').value;
    if(aina == 'kozi'){
      document.getElementById('sehemuKozi').classList.remove('hidden');
      document.getElementById('sehemuMaudhui').classList.add('hidden');
      document.getElementById('bei').value = 5000;
    } else {
      document.getElementById('sehemuKozi').classList.add('hidden');
      document.getElementById('sehemuMaudhui').classList.remove('hidden');
      document.getElementById('bei').value = 500;
    }
  }

  // PREVIEW YA PICHA
  document.getElementById('pichaGallery').addEventListener('change', function(e){
    const file = e.target.files[0];
    if(file){
      const reader = new FileReader();
      reader.onload = function(event){
        document.getElementById('preview').src = event.target.result;
        document.getElementById('preview').style.display = 'block';
      }
      reader.readAsDataURL(file);
    }
  });

  document.getElementById('fomuOngeza').addEventListener('submit', function(e){
    e.preventDefault();
    let aina = document.getElementById('aina').value;
    let ujumbe = "Asante! Maudhui yako yametumwa.";

    if(aina == 'kozi'){
      ujumbe = "Asante! Kozi yako imetumwa.\nInahitaji video isiyozidi dakika 5 + PDF + Maswali";
    }
    alert(ujumbe);
  });
</script>

</body>
  </html>
