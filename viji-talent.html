<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viji Stage Live</title>
<style>
    * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#000; font-family:Arial; color:white; overflow:hidden; }

  .stage-video {
    width:100%; height:100vh; object-fit:cover; background:#111;
  }

  .stage-top {
    position:absolute; top:15px; left:15px; right:15px;
    display:flex; justify-content:space-between; align-items:center;
  }
  .btn-rudi {
    background:rgba(0,0,0,0.6); color:white; border:none;
    padding:10px 15px; border-radius:8px; font-weight:bold;
  }
  .btn-funga {
    background:red; color:white; border:none;
    padding:10px 15px; border-radius:8px; font-weight:bold;
  }

  .stage-info {
    position:absolute; bottom:120px; left:15px;
    background: rgba(0,0,0,0.6); padding:12px; border-radius:12px;
  }
  .stage-info h3 { margin:0; font-size:18px; }
  .stage-info p { margin:5px 0; font-size:13px; }
  .idadi { color:#0FB5B3; font-weight:bold; font-size:16px; }
  .timer { color:yellow; font-size:12px; }

  .btn-moyo {
    position:absolute; bottom:120px; right:20px;
    background:#0FB5B3; border:none; color:white;
    width:65px; height:65px; border-radius:50%;
    font-size:28px; cursor:pointer; transition:0.2s;
    box-shadow:0 0 15px #0FB5B3;
  }
  .btn-moyo:disabled { background:gray; box-shadow:none; cursor:not-allowed; }
  .btn-moyo:active { transform:scale(0.9); }

  .moyo-animate {
    position:absolute; font-size:30px; animation:fly 1s ease-out forwards;
    pointer-events:none;
  }
  @keyframes fly {
    0% { opacity:1; transform:translateY(0) scale(1); }
    100% { opacity:0; transform:translateY(-200px) scale(1.5); }
  }
</style>
</head>
<body>

<video class="stage-video" autoplay muted loop>
  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<div class="stage-top">
  <button class="btn-rudi" onclick="rudiNyuma()">← Rudi</button>
  <button class="btn-funga" onclick="fungaStage()">X Toka</button>
</div>

<div class="stage-info">
  <h3 id="jinaLaLive">🎤 Inapakia Live...</h3>
  <p>👀 <span class="idadi" id="wanaotazama">247</span> wanaangalia</p>
  <p>❤️ <span class="idadi" id="jumlaMiyo">0</span> Miyoyo Halali</p>
  <p>💰 <span class="idadi" id="pesa">Tsh 0</span></p>
  <p class="timer" id="timer">Kaa dakika 1 ili moyo uheshimiwe</p>
</div>

<button class="btn-moyo" id="btnMoyo" onclick="toaMoyo(event)">❤️</button>

<script>
let liveId = localStorage.getItem("liveInayoendeshwa") || "juma-live"; 
let miyo = 0; 
let dakika = 0; 
let moyoHalali = false;
let watu = 247;

// 1. WEKA JINA KWA KUTEGEMEA NI NANI
window.onload = function(){
  if(liveId.includes("juma")){ 
    document.getElementById('jinaLaLive').innerText = "🎤 Juma - Bongo Fleva Live"; 
  }
  
  // ANGALIA KAMA KASHA TOA MOYO
  if(localStorage.getItem(liveId) == "ndiyo"){
    document.getElementById('btnMoyo').disabled = true;
    document.getElementById('btnMoyo').innerText = "✅";
    document.getElementById('timer').innerText = "Umeshatoa moyo wako";
    moyoHalali = true;
  }
  
  anzaTimer();
  anzaWatu();
}

// 2. TIMER YA DAKIKA 1
function anzaTimer(){
  setInterval(() => {
    dakika++;
    document.getElementById('timer').innerText = "Umekaa: " + dakika + " dk";
    
    if(dakika >= 1 && moyoHalali == false){
      document.getElementById('timer').innerText = "Sasa unaweza kutoa moyo ❤️";
    }
  }, 60000); // Dakika 1
}

// 3. ONGEZA WATU BANDIA
function anzaWatu(){
  setInterval(() => {
    watu = watu + Math.floor(Math.random() * 3);
    document.getElementById('wanaotazama').innerText = watu;
  }, 5000);
}

// 4. KUTOA MOYO - KANUNI KALI
function toaMoyo(event){
  if(dakika < 1){
    alert("Subiri dakika 1 kwanza ili moyo wako uheshimiwe");
    return;
  }
  
  if(localStorage.getItem(liveId) == "ndiyo"){
    alert("Umeshatoa moyo wako kwenye Live hii tayari");
    return;
  }

  // ONGEZA MOYO + PESA
  miyo++;
  document.getElementById('jumlaMiyo').innerText = miyo;
  document.getElementById('pesa').innerText = "Tsh " + (miyo * 10);
  
  // KUMBUKA KWENYE SIMU YAKE HATA AKITOKA
  localStorage.setItem(liveId, "ndiyo"); 
  moyoHalali = true;
  
  // ANIMATION YA MOYO KUPAA
  let moyo = document.createElement("div");
  moyo.innerHTML = "❤️";
  moyo.classList.add("moyo-animate");
  moyo.style.left = event.clientX + "px";
  moyo.style.top = event.clientY + "px";
  document.body.appendChild(moyo);
  setTimeout(() => moyo.remove(), 1000);
  
  // ZIMA KITUFE
  document.getElementById('btnMoyo').disabled = true;
  document.getElementById('btnMoyo').innerText = "✅";
  document.getElementById('timer').innerText = "Asante kwa moyo wako ❤️";
}

// 5. KUFUNGA NA KUHIFADHI
function fungaStage(){
  if(confirm("Una uhakika unataka kutoka?\n\nMuda: " + dakika + " dk\nMiyoyo: " + miyo + "\nPesa: Tsh " + (miyo * 10))){
    alert("✅ Live Imehifadhiwa kama Replay!\n\nMuda Wote: " + dakika + " dk\nMiyoyo Halali: " + miyo + "\nMapato: Tsh " + (miyo * 10));
    window.location.href = "viji-talent.html"; 
  }
}

function rudiNyuma(){
  window.location.href = "viji-talent.html";
}
</script>
</body>
   </html>
