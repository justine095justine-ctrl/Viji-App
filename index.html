<!DOCTYPE html>
<html lang="sw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Viji App - Fursa Ziko Mkononi</title>
<style>
    *{margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI', Arial}
    body{background:#0D0F1A; color:white; min-height:100vh}
    
    .header{background:linear-gradient(135deg, #15803D, #F97316); padding:30px 15px; text-align:center}
    .header h1{font-size:28px; margin-bottom:5px}
    .header p{opacity:0.8; font-size:14px}
    
    .container{padding:20px}
    
    .menu-grid{display:grid; grid-template-columns:1fr; gap:15px; margin-top:20px}
    
    .menu-card{
        text-decoration:none; 
        color:white; 
        padding:25px 20px; 
        border-radius:15px; 
        display:flex; 
        align-items:center; 
        gap:15px;
        transition:transform 0.2s
    }
    .menu-card:active{transform:scale(0.97)}
    
    .menu-card .icon{font-size:35px}
    .menu-card .text h3{font-size:18px; margin-bottom:3px}
    .menu-card .text p{font-size:12px; opacity:0.8}
    
    .card-sokoni{background:linear-gradient(135deg, #22C55E, #15803D)}
    .card-skills{background:linear-gradient(135deg, #2563EB, #1E3A8A)}
    .card-trends{background:linear-gradient(135deg, #F97316, #EA580C)}
    
    .footer{padding:20px; text-align:center; font-size:11px; opacity:0.5; margin-top:30px}
</style>
</head>
<body>

<div class="header">
    <h1>🚀 VIJI APP</h1>
    <p>Fursa Ziko Mkononi Mwako</p>
</div>

<div class="container">
    <h2 style="font-size:16px; margin-bottom:15px">Chagua Unachotaka 👇</h2>
    
    <div class="menu-grid">
        
        <!-- KADI 1: VIJI SOKONI -->
        <a href="viji-sokoni.html" class="menu-card card-sokoni">
            <div class="icon">🛒</div>
            <div class="text">
                <h3>Viji Sokoni</h3>
                <p>Uza na Nunua Bidhaa - Post 3 Bure</p>
            </div>
        </a>

        <!-- KADI 2: VIJI SKILLS -->
        <a href="viji-skills.html" class="menu-card card-skills">
            <div class="icon">🔧</div>
            <div class="text">
                <h3>Viji Skills</h3>
                <p>Pata Fundi / Jiandikishe Kama Fundi</p>
            </div>
        </a>

        <!-- KADI 3: VIJI TRENDS -->
        <a href="viji-trends.html" class="menu-card card-trends">
            <div class="icon">🔥</div>
            <div class="text">
                <h3>Viji Trends</h3>
                <p>Video Fupi + Viral + Methali</p>
            </div>
        </a>

    </div>
</div>

<div class="footer">
    © 2026 Viji App - Made in Mwanza, TZ
</div>

</body>
</html>
