<!DOCTYPE html>
<html lang="sw">
<head>
  <meta charset="UTF-8">
  <title>Viji Stage Live</title>
  <style>
    body { margin:0; background:#000; font-family:Arial; overflow:hidden; }
    .stage-video { width:100%; height:100vh; object-fit:cover; background:#222; }
    .stage-info { position:absolute; bottom:100px; left:15px; color:white; background: rgba(0,0,0,0.5); padding:10px; border-radius:10px; }
    .stage-info h3 { margin:0; font-size:18px; }
    .btn-moyo { position:absolute; bottom:100px; right:20px; background:#0FB5B3; border:none; color:white; width:60px; height:60px; border-radius:50%; font-size:24px; cursor:pointer; }
    .btn-moyo:disabled { background:gray; }
    .btn-funga { position:absolute; top:20px; right:20px; background:red; color:white; border:none; padding:10px 15px; border-radius:8px; font-weight:bold; }
    .idadi { color:#0FB5B3; font-weight:bold; } .timer { color:yellow; font-size:12px; }
  </style>
</head>
<body>

<video class="stage-video" autoplay muted loop>
  <source src="https://www.w3schools.com/html/mov_bbb.mp4" type="video/mp4">
</video>

<div class="stage-info">
  <h3 id="jinaLaLive">🎤 Inapakia...</h3>
  <p>👀 <span class="idadi" id="wanaotazama">247</span> wanaangalia</p>
  <p>❤️ <span class="idadi" id="jumlaMiyo">0</span> Miyoyo Halali</p>
  <p class="timer" id="timer">Kaa dakika 1 ili moyo uheshimiwe</p>
</div>

<button class="btn-moyo" id="btnMoyo" onclick="toaMoyo()">❤️</button>
<button class="btn-funga" onclick="fungaStage()">X</button>

<script>
let liveId = localStorage.getItem("liveInayoendeshwa") || "juma-live-06-09-2026"; 
let miyo = 0; let dakika = 0; let moyoHalali = false;

// WEKA JINA KWA KUTEGEMEA NI NANI
if(liveId.includes("juma")){ document.getElementById('jinaLaLive').innerText = "🎤 Juma - Bongo Fleva"; }
if(liveId.includes("amina")){ document.getElementById('jinaLaLive').innerText = "💃 Amina - Dansi"; }

window.onload = function(){
  if(localStorage.getItem(liveId) == "ndiyo"){
    document.getElementById('btnMoyo').disabled = true;
    document.getElementById('btnMoyo').innerText = "✅";
    document.getElementById('timer').innerText = "Umeshatoa moyo wako";
    moyoHalali = true;
  }
  setInterval(() => { dakika++; document.getElementById('timer').innerText = "Umekaa: " + dakika + " dk"; if(dakika >= 1 && !moyoHalali){ document.getElementById('timer').innerText = "Sasa unaweza kutoa moyo ❤️"; } }, 60000);
}

function toaMoyo(){
  if(dakika < 1){ alert("Subiri dakika 1 kwanza"); return; }
  if(localStorage.getItem(liveId) == "ndiyo"){ alert("Umeshatoa moyo wako"); return; }
  miyo++; document.getElementById('jumlaMiyo').innerText = miyo;
  localStorage.setItem(liveId, "ndiyo"); moyoHalali = true;
  document.getElementById('btnMoyo').disabled = true; document.getElementById('btnMoyo').innerText = "✅";
}

function fungaStage(){
  if(confirm("Toka Live?\nMuda: " + dakika + " dk\nMiyoyo: " + miyo)){
    alert("✅ Live Imehifadhiwa!\nPesa: Tsh " + (miyo * 10));
    window.location.href = "profile.html"; 
  }
}
</script>
</body>
</html>
